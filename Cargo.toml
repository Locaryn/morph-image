[package]
name = "locaryn-plugin-image"
version = "2.1.0"
edition = "2021"
description = "Official Locaryn Extension: Image generation and mask-based AI editing (Flux, Stable Diffusion, SDXL, Z-Image)"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "locaryn-image-mcp"
path = "src/bin/image_mcp.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
url = "2"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[workspace]
