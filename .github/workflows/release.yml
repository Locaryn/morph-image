name: Release Extension

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Une extension qui ne compile pas ne doit pas partir en release : jusqu'ici
  # le .zip n'embarquait que des sources, et personne ne s'en apercevait avant
  # l'installation.
  check:
    name: Vérifier la compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked

      # Le catalogue et l'interface partent tels quels chez l'utilisateur : un
      # JSON cassé ou un script qui ne s'analyse pas ne se verrait qu'une fois
      # l'extension installée.
      - name: Vérifier les fichiers livrés à l'interface
        run: |
          set -euo pipefail
          node --check dist/ui.js
          node scripts/check-catalogue.mjs

  bundle:
    name: Bundle ${{ matrix.label }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
            binary: locaryn-image-gen-mcp
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            binary: locaryn-image-gen-mcp.exe
          # Compilé croisé depuis Apple Silicon : les runners macos-13 sont
          # retirés et un job qui les demande reste en file d'attente.
          - os: macos-14
            target: x86_64-apple-darwin
            label: macos-x86_64
            binary: locaryn-image-gen-mcp
          - os: macos-14
            target: aarch64-apple-darwin
            label: macos-aarch64
            binary: locaryn-image-gen-mcp
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.88
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Compiler le serveur MCP
        run: cargo build --release --locked --target ${{ matrix.target }} --bin locaryn-image-gen-mcp

      # Le paquet ne contient que ce qui tourne chez l'utilisateur : le
      # manifeste, la compétence, l'interface, la configuration MCP et le
      # binaire. Les sources restent sur le dépôt.
      - name: Assembler le paquet
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bundle
          mkdir -p bundle/bin
          cp plugin.json SKILL.md README.md LICENSE bundle/
          cp -r dist mcp bundle/
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" bundle/bin/
          test -f bundle/bin/${{ matrix.binary }}
          test -f bundle/plugin.json
          test -f bundle/dist/ui.js
          test -f bundle/dist/marketplace.json
          test -f bundle/mcp/mcp.json

      # Les artefacts ne conservent pas le bit exécutable ; le job de release
      # le repose avant d'archiver, sinon le serveur MCP livré ne démarre pas
      # sous Linux et macOS.
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.label }}
          path: bundle
          if-no-files-found: error

  release:
    name: Publier la release
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dl
          pattern: bundle-*

      - name: Archiver chaque plateforme
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' plugin.json | head -n 1)"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p out
          for dir in dl/bundle-*; do
            label="${dir#dl/bundle-}"
            chmod +x "$dir"/bin/* || true
            ( cd "$dir" && zip -r -q "$GITHUB_WORKSPACE/out/plugin-image-gen-v${VERSION}-${label}.zip" . )
          done
          ls -l out

      - name: Vérifier les archives
        run: |
          set -euo pipefail
          test "$(ls out/*.zip | wc -l)" -eq 4
          for archive in out/*.zip; do
            unzip -l "$archive" | grep -q "plugin.json"
            unzip -l "$archive" | grep -q "dist/ui.js"
            unzip -l "$archive" | grep -q "dist/marketplace.json"
            unzip -l "$archive" | grep -q "mcp/mcp.json"
            unzip -l "$archive" | grep -q "bin/locaryn-image-gen-mcp"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: plugin-image-gen-archives
          path: out/*.zip
          if-no-files-found: error

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: false
          name: "plugin-image-gen ${{ github.ref_name }}"
          files: out/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
