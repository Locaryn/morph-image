name: Release Extension

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Une extension qui ne compile pas ne doit pas partir en release : jusqu'ici
  # le .zip n'embarquait que des sources, et personne ne s'en apercevait avant
  # l'installation.
  check:
    name: Vérifier la compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked

      # Le catalogue et l'interface partent tels quels chez l'utilisateur : un
      # JSON cassé ou un script qui ne s'analyse pas ne se verrait qu'une fois
      # l'extension installée.
      - name: Vérifier les fichiers livrés à l'interface
        run: |
          set -euo pipefail
          node --check dist/ui.js
          node scripts/check-catalogue.mjs

  bundle:
    name: Bundle ${{ matrix.label }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
            binary: locaryn-image-mcp
            engine_match: ubuntu|linux
            engine_exclude: musl|arm|aarch
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            binary: locaryn-image-mcp.exe
            engine_match: win.*(vulkan|avx2)
            engine_exclude: cuda|rocm|arm64|hip
          # Compilé croisé depuis Apple Silicon : les runners macos-13 sont
          # retirés et un job qui les demande reste en file d'attente.
          - os: macos-14
            target: x86_64-apple-darwin
            label: macos-x86_64
            binary: locaryn-image-mcp
            engine_match: mac.*(x64|x86_64|intel)
            engine_exclude: arm64|aarch64
          - os: macos-14
            target: aarch64-apple-darwin
            label: macos-aarch64
            binary: locaryn-image-mcp
            engine_match: mac.*(arm64|aarch64)
            engine_exclude: x64|x86_64
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.88
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Compiler le serveur MCP
        run: cargo build --release --locked --target ${{ matrix.target }} --bin locaryn-image-mcp

      # Le moteur de diffusion voyage avec l'extension.
      #
      # Il était téléchargé après coup, par un outil que le modèle devait
      # penser à appeler : on installait le plugin, l'interface s'ouvrait, et
      # rien ne pouvait générer. Un moteur n'est pas un modèle — c'est ce qui
      # fait tourner les modèles, et ça n'a pas à s'installer à part.
      #
      # L'archive est résolue au moment de la construction plutôt que codée en
      # dur : les noms d'assets de stable-diffusion.cpp changent d'une version
      # à l'autre, et un nom figé se périme sans prévenir.
      - name: Récupérer le moteur de diffusion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ATTENDU: ${{ matrix.engine_match }}
          EXCLU: ${{ matrix.engine_exclude }}
        run: |
          set -euo pipefail
          mkdir -p engine
          gh release view --repo leejet/stable-diffusion.cpp \
            --json tagName,assets --jq '.tagName, (.assets[].name)' > liste.txt
          TAG="$(head -n 1 liste.txt)"
          ASSET="$(tail -n +2 liste.txt \
            | grep -Ei "$ATTENDU" \
            | grep -Eiv "$EXCLU" \
            | grep -Ei '\.zip$' \
            | head -n 1 || true)"
          if [ -z "$ASSET" ]; then
            echo "::error::aucune archive de moteur pour ${{ matrix.label }} dans $TAG"
            tail -n +2 liste.txt
            exit 1
          fi
          echo "moteur retenu : $ASSET ($TAG)"
          gh release download "$TAG" --repo leejet/stable-diffusion.cpp \
            --pattern "$ASSET" --dir engine --clobber
          # À plat : l'exécutable ne démarre pas sans ses bibliothèques dans le
          # même dossier, et les archives les rangent tantôt à la racine,
          # tantôt sous un sous-dossier de build.
          mkdir -p engine/flat
          ( cd engine && unzip -o -q -j "$ASSET" -d flat )
          test -f engine/flat/sd -o -f engine/flat/sd.exe

      # Le paquet ne contient que ce qui tourne chez l'utilisateur : le
      # manifeste, la compétence, l'interface, la configuration MCP, le serveur
      # et le moteur. Les sources restent sur le dépôt.
      - name: Assembler le paquet
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bundle
          mkdir -p bundle/bin
          cp plugin.json SKILL.md README.md LICENSE bundle/
          cp -r dist mcp bundle/
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" bundle/bin/
          mkdir -p bundle/bin/sd
          cp engine/flat/* bundle/bin/sd/
          test -f bundle/bin/${{ matrix.binary }}
          test -f bundle/bin/sd/sd -o -f bundle/bin/sd/sd.exe
          test -f bundle/plugin.json
          test -f bundle/dist/ui.js
          test -f bundle/dist/marketplace.json
          test -f bundle/mcp/mcp.json

      # Les artefacts ne conservent pas le bit exécutable ; le job de release
      # le repose avant d'archiver, sinon le serveur MCP livré ne démarre pas
      # sous Linux et macOS.
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.label }}
          path: bundle
          if-no-files-found: error

  release:
    name: Publier la release
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dl
          pattern: bundle-*

      - name: Archiver chaque plateforme
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' plugin.json | head -n 1)"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p out
          for dir in dl/bundle-*; do
            label="${dir#dl/bundle-}"
            chmod +x "$dir"/bin/* "$dir"/bin/sd/* || true
            ( cd "$dir" && zip -r -q "$GITHUB_WORKSPACE/out/plugin-image-v${VERSION}-${label}.zip" . )
          done
          ls -l out

      - name: Vérifier les archives
        run: |
          set -euo pipefail
          test "$(ls out/*.zip | wc -l)" -eq 4
          for archive in out/*.zip; do
            unzip -l "$archive" | grep -q "plugin.json"
            unzip -l "$archive" | grep -q "dist/ui.js"
            unzip -l "$archive" | grep -q "dist/marketplace.json"
            unzip -l "$archive" | grep -q "mcp/mcp.json"
            unzip -l "$archive" | grep -q "bin/locaryn-image-mcp"
            # Le moteur doit être là : une extension d'image qui ne génère pas
            # est une extension qui ne sert à rien.
            unzip -l "$archive" | grep -Eq "bin/sd/sd(\.exe)?$"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: plugin-image-archives
          path: out/*.zip
          if-no-files-found: error

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: false
          name: "plugin-image ${{ github.ref_name }}"
          files: out/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
